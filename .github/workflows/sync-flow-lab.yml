name: Sync Flow Lab from Backend

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-flow-lab.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Fetch latest Flow Lab from backend develop
        run: |
          git clone --depth 1 --branch develop https://github.com/bobfull-project/bobfull-backend.git /tmp/bobfull-backend
          rm -rf flow-lab/v3/operations-flow-lab
          cp -R /tmp/bobfull-backend/docs/flow-lab/v3/operations-flow-lab flow-lab/v3/

      - name: Commit sync when changed
        run: |
          if git diff --quiet -- flow-lab/v3/operations-flow-lab; then
            echo "Flow Lab is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flow-lab/v3/operations-flow-lab
          git commit -m "docs: sync Flow Lab from backend develop"
          git push
